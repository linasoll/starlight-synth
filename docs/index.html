        <div class="transport-buttons__container">

      <div class="part-settings__wrapper">
        <div class="container settings__container">
          <h2>melody</h2>

          <div class="setting__wrapper">
            <h3>sequence</h3>
            <div class="sequence__wrapper">
              <button class="sequence__button" id="melody__sequence-1"></button>
              <button class="sequence__button" id="melody__sequence-2"></button>
              <button class="sequence__button" id="melody__sequence-3"></button>
              <button class="sequence__button" id="melody__sequence-4"></button>
            </div>
          </div>

          <div class="setting__wrapper">
            <h3>volume</h3>
            <div class="volume__wrapper">
              <input class="slider" id="melody-volume" type="range" min="-60" max="12" step="1" value="0">
              <button class="mute__button" id="melody-mute">mute</button>
            </div>
          </div>

          <div class="setting__wrapper">
            <h3>decay</h3>
              <input class="slider slider__effects" id="melody-decay" type="range" min="0.1" max="5" step="0.1" value="2">
          </div>

          <div class="setting__wrapper">
            <h3>echo</h3>
              <input class="slider slider__effects" id="melody-echo" type="range" min="0" max="1" step="0.01" value="0">
          </div>
        </div>

        <div class="container settings__container">
          <h2>harmony</h2>
